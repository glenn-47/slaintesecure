{% extends "base.html" %}
{% block title %}Sign record · Sláinte Secure{% endblock %}
{% block content %}
<section class="card">
  <h1>Sign record #{{ record_id }}</h1>
  <p>Signing confirms you wrote this record and locks in its contents. Re-enter your password to unlock your signing key.</p>

  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">Your password</label>
    <input id="password" type="password" name="password" maxlength="128" required
           autocomplete="current-password" autofocus>

    <button type="submit">Sign record</button>
  </form>

  <p class="muted switch"><a href="{{ url_for('records.view_record', record_id=record_id) }}">Cancel</a></p>
</section>
{% endblock %}
